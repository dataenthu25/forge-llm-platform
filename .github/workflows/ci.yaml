name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: astral-sh/setup-uv@v6
      - run: make lint

  # Deploys the chart to a throwaway Kubernetes cluster on the CI runner,
  # loads a real (tiny) model on CPU and runs the smoke test against it.
  e2e-kind:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the vLLM image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: azure/setup-helm@v4
      - uses: astral-sh/setup-uv@v6
      - uses: helm/kind-action@v1
        with:
          cluster_name: forge
          config: deploy/kind/cluster.yaml
      - name: Pre-load the vLLM image into the cluster
        run: |
          IMG=$(grep -A3 '^image:' deploy/charts/vllm-pool/values.yaml | awk '/repository:/{r=$2}/tag:/{t=$2}END{print r":"t}')
          docker pull "$IMG"
          kind load docker-image "$IMG" --name forge
      - run: kubectl create namespace forge
      - name: Deploy
        run: make deploy
      - name: Wait for the model to load
        run: make wait
      - name: Smoke test
        run: |
          make port-forward >/tmp/pf.log 2>&1 &
          sleep 5
          make smoke
      - name: Debug info on failure
        if: failure()
        run: |
          kubectl -n forge get pods -o wide
          kubectl -n forge describe pods
          kubectl -n forge logs deploy/chat-vllm-pool --tail=200 || true
